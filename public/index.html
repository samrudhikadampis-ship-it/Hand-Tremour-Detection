<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Pulse — Tremor monitoring</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="Pulse overview">
          <span class="brand-mark">✳</span>
          <span>pulse<span class="brand-period">.</span></span>
        </a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-link active" href="#overview" data-page="overview" title="Overview"><span class="nav-icon">▦</span>Overview</a>
          <a class="nav-link" href="#monitoring" data-page="monitoring" title="Live monitoring"><span class="nav-icon">⌁</span>Live monitoring</a>
          <a class="nav-link" href="#risk" data-page="risk" title="Risk analysis"><span class="nav-icon">◈</span>Risk analysis</a>
          <a class="nav-link" href="#predictions" data-page="predictions" title="Predictions"><span class="nav-icon">⌁</span>Predictions</a>
          <a class="nav-link" href="#reports" data-page="reports" title="Reports and logs"><span class="nav-icon">▤</span>Reports &amp; logs</a>
        </nav>
        <div class="sidebar-label people-label">YOUR SUPPORT</div>
        <nav class="primary-nav" aria-label="Support navigation">
          <a class="nav-link" href="#care" data-page="care" title="Care team"><span class="nav-icon">♡</span>Care team</a>
          <a class="nav-link" href="#hardware" data-page="hardware" title="Hardware"><span class="nav-icon">⌘</span>Hardware</a>
          <a class="nav-link profile-link" href="#profile" data-page="profile" title="Patient profile"><span class="nav-icon">⚙</span>Patient profile</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="mini-care">
            <div class="avatar avatar-small">AM</div>
            <div><strong>Dr. Arun Mehta</strong><span>Your care team</span></div>
            <span class="online-dot"></span>
          </div>
          <div class="sidebar-user">
            <div class="avatar user-avatar">S</div>
            <div><strong>Samruddhi</strong><span>Patient ID · PC-20481</span></div>
            <span class="user-menu">···</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span class="crumb-dot"></span><span id="breadcrumb">Overview</span></div>
          <div class="topbar-actions">
            <time class="local-clock" id="live-clock" aria-label="Current local time">--:--</time>
            <span class="local-date" id="live-date"></span>
            <span class="sync-pill"><span class="sync-icon">⌁</span><span id="sync-label">Device synced</span></span>
            <button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button>
            <button class="user-menu-button"><span class="avatar top-avatar">S</span><span>Samruddhi</span><span class="chevron">⌄</span></button>
          </div>
        </header>
        <div id="app-content" class="page-content"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
