services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tremor_monitor}
      MYSQL_USER: ${MYSQL_USER:-tremor_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev-app-password}
    ports:
      - "3306:3306"
    volumes:
      - tremor_mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-dev-root-password}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tremor_mysql:
